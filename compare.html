<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: #202124;
      background: #eef0f4;
      font: 14px/1.4 system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 3.5rem;
      padding: .75rem 1rem;
      border-bottom: 1px solid #d8dbe2;
      background: #fff;
    }
    h1 { margin: 0; font-size: 1rem; }
    header a { color: inherit; }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      height: calc(100% - 3.5rem);
      background: #c9cdd6;
    }
    section {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      background: #fff;
    }
    h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0;
      padding: .6rem 1rem;
      border-bottom: 1px solid #e1e3e8;
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h2 a { color: #4b5563; font-size: .75rem; text-transform: none; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 760px) {
      header { min-height: 4rem; }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, minmax(32rem, 1fr));
        height: auto;
      }
      section { height: 70vh; min-height: 32rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Personal website comparison</h1>
    <a href="index.html">Exit comparison</a>
  </header>
  <main>
    <section>
      <h2>Old version <a href="old/index.html" target="_blank">Open ↗</a></h2>
      <iframe src="old/index.html" title="Old website version"></iframe>
    </section>
    <section>
      <h2>New version <a href="index.html" target="_blank">Open ↗</a></h2>
      <iframe src="index.html" title="New website version"></iframe>
    </section>
  </main>
</body>
</html>
